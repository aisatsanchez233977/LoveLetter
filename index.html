<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para sa'yo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b0f1c; --night2:#341727; --rose:#d4a08a; --wax:#8c2a45; --wax2:#b8415f;
  --paper:#f2e3dc; --ink:#3b2230; --soft:#7a5565;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --script:'Pinyon Script','Snell Roundhand',cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{--night:#1b0f1c;--paper:#f2e3dc}}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;background:radial-gradient(120% 80% at 50% 0%,var(--night2),var(--night) 70%) fixed;color:var(--paper);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow-x:hidden}
canvas#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* COVER */
#cover{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2rem;padding:2rem;transition:opacity 1s ease,visibility 1s;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;color:inherit;width:100%;font:inherit}
#cover.gone{opacity:0;visibility:hidden}
.to{font-family:var(--script);font-size:clamp(2.4rem,11vw,3.6rem);color:var(--rose);text-align:center;line-height:1.2}
.env{position:relative;width:min(84vw,340px);aspect-ratio:3/2;perspective:900px;filter:drop-shadow(0 24px 40px rgba(0,0,0,.55))}
.env .back{position:absolute;inset:0;background:linear-gradient(160deg,#e8cfc3,#cfa392);border-radius:6px}
.env .lining{position:absolute;inset:0;border-radius:6px;background:linear-gradient(#7d3149,#5a2036);clip-path:polygon(0 0,100% 0,50% 58%)}
.env .front{position:absolute;inset:0;border-radius:6px;background:linear-gradient(150deg,#f0d9cc,#d9ae9b);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;transform-origin:top;transition:transform .9s cubic-bezier(.5,0,.2,1);background:linear-gradient(180deg,#e9cdbf,#d6a995);clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;z-index:3}
.seal{position:absolute;left:50%;top:56%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--wax2),var(--wax) 65%,#5e1a2f);box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 0 0 3px rgba(255,255,255,.08);z-index:4;display:grid;place-items:center;transition:opacity .4s}
.seal svg{width:52%;fill:#f6d9df;opacity:.92}
#cover.open .flap{transform:rotateX(180deg)}
#cover.open .seal{opacity:0}
.hint{font-style:italic;color:var(--soft);font-size:1.1rem;letter-spacing:.04em;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}

/* LETTER */
#letter{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:3.5rem 1.1rem 5rem;opacity:0;visibility:hidden;transition:opacity 1.2s ease .3s}
#letter.show{opacity:1;visibility:visible}
.paper{background:linear-gradient(180deg,#f6e9e2,var(--paper));color:var(--ink);border-radius:4px;padding:2.6rem 1.6rem 3rem;box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(140,42,69,.12);position:relative}
.paper::before{content:"";position:absolute;inset:10px;border:1px solid rgba(140,42,69,.22);border-radius:2px;pointer-events:none}
.greet{font-family:var(--script);font-size:clamp(2.2rem,10vw,3rem);color:var(--wax);line-height:1.2;margin-bottom:1.6rem}
.line{font-size:clamp(1.2rem,4.9vw,1.4rem);line-height:1.75;margin-bottom:1.3rem;opacity:0;transform:translateY(10px);transition:opacity 1s ease,transform 1s ease}
.line.in{opacity:1;transform:none}
.line em{color:var(--wax)}
.counter{margin:2.2rem 0 1.6rem;text-align:center;opacity:0;transition:opacity 1.2s}
.counter.in{opacity:1}
.counter b{display:block;font-family:var(--script);font-size:3.6rem;font-weight:400;color:var(--wax);line-height:1}
.counter span{font-style:italic;color:var(--soft);font-size:1.1rem}
.sign{margin-top:2rem;text-align:right;opacity:0;transition:opacity 1.4s}
.sign.in{opacity:1}
.sign small{display:block;font-style:italic;font-size:1.1rem;color:var(--soft)}
.sign .name{font-family:var(--script);font-size:2.6rem;color:var(--wax);line-height:1.3}
.ps{margin-top:1.6rem;font-style:italic;font-size:1.15rem;color:var(--soft);opacity:0;transition:opacity 1.4s}
.ps.in{opacity:1}
.again{display:block;margin:2.2rem auto 0;background:none;border:1px solid rgba(212,160,138,.5);color:var(--rose);font:inherit;font-size:1.1rem;padding:.7rem 1.6rem;border-radius:99px;cursor:pointer}
.again:focus-visible,#cover:focus-visible{outline:2px solid var(--rose);outline-offset:4px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>

<button id="cover" type="button" aria-label="Buksan ang sulat">
  <div class="to" id="toName"></div>
  <div class="env">
    <div class="back"></div><div class="lining"></div><div class="front"></div>
    <div class="flap"></div>
    <div class="seal"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 2.9 5 6.3 5c2 0 3.7 1.1 5.7 3.3C14 6.1 15.7 5 17.7 5c3.4 0 5.3 3.6 3.9 6.8C19.5 16.4 12 21 12 21z"/></svg></div>
  </div>
  <div class="hint">pindutin para buksan</div>
</button>

<main id="letter">
  <article class="paper">
    <div class="greet" id="greet"></div>
    <div id="lines"></div>
    <div class="counter" id="counter" hidden><b id="days"></b><span>na araw na kitang minamahal</span></div>
    <div class="sign" id="sign"><small id="closing"></small><div class="name" id="from"></div></div>
    <p class="ps" id="ps"></p>
  </article>
  <button class="again" id="again" type="button">basahin ulit</button>
</main>

<script>
/* ====== PALITAN MO DITO ====== */
const CONFIG = {
  to: "Griezel",                       // pangalan niya
  from: "Mark",              // pangalan mo
  since: "2018-09-15",                  // simula ng inyo (YYYY-MM-DD) — burahin ang laman ("") para walang counter
  closing: "Walang hanggang sa'yo,",
  lines: [
    "Hindi ako magaling sa mga salita, pero gusto kong subukan, kasi ikaw ang dahilan kung bakit gusto kong magsulat nang ganito.",
    "Sa dami ng ingay sa mundo, ikaw ang pinaka-tahimik na saya ko. Kapag kasama kita, <em>gumagaan ang lahat</em>.",
    "Salamat sa pag-intindi mo sa akin, sa pag-stay mo kahit pagod ka na rin, at sa bawat maliit na bagay na ginagawa mo na akala mo hindi ko napapansin. Napapansin ko. Lahat.",
    "Kung bibigyan ako ng pagkakataong pumili ulit, pipiliin pa rin kita. Ngayon, bukas, at sa lahat ng susunod pa."
  ],
  ps: "P.S. Mahal na mahal kita. Sinulat ko 'to nang nakangiti."
};
/* ============================= */

const $ = id => document.getElementById(id);
$('toName').textContent = "Para kay " + CONFIG.to;
$('greet').textContent = "Mahal kong " + CONFIG.to + ",";
$('closing').textContent = CONFIG.closing;
$('from').textContent = CONFIG.from;
$('ps').textContent = CONFIG.ps;
const linesEl = $('lines');
CONFIG.lines.forEach(t => { const p = document.createElement('p'); p.className = 'line'; p.innerHTML = t; linesEl.appendChild(p); });
if (CONFIG.since) {
  const d = Math.max(0, Math.floor((Date.now() - new Date(CONFIG.since + 'T00:00:00')) / 864e5));
  if (!isNaN(d)) { $('days').textContent = d.toLocaleString(); $('counter').hidden = false; }
}

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .35 });
function watch(){ document.querySelectorAll('.line,.counter,.sign,.ps').forEach(el => { el.classList.remove('in'); io.observe(el); }); }

const cover = $('cover'), letter = $('letter');
cover.addEventListener('click', () => {
  if (cover.classList.contains('open')) return;
  cover.classList.add('open');
  setTimeout(() => { cover.classList.add('gone'); letter.classList.add('show'); window.scrollTo(0,0); watch(); }, 1100);
});
$('again').addEventListener('click', () => {
  letter.classList.remove('show'); window.scrollTo({top:0});
  cover.classList.remove('open','gone');
});

/* petals */
(function(){
  const c = $('petals'), x = c.getContext('2d'); let W, H, P = [];
  const dpr = Math.min(devicePixelRatio || 1, 2);
  function size(){ W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr; }
  size(); addEventListener('resize', size);
  const n = innerWidth < 600 ? 22 : 40;
  for (let i = 0; i < n; i++) P.push(mk(true));
  function mk(init){ return { x: Math.random()*W, y: init ? Math.random()*H : -20, r: (6+Math.random()*9)*dpr, vy: (.25+Math.random()*.6)*dpr, vx: (Math.random()-.5)*.3*dpr, a: Math.random()*6.28, va: (Math.random()-.5)*.02, o: .15+Math.random()*.3 }; }
  function draw(){
    x.clearRect(0,0,W,H);
    P.forEach((p,i) => {
      p.y += p.vy; p.x += p.vx + Math.sin(p.a)*.4*dpr; p.a += p.va;
      if (p.y > H + 30) P[i] = mk(false);
      x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.globalAlpha = p.o;
      x.fillStyle = '#d4a08a'; x.beginPath();
      x.moveTo(0,-p.r); x.bezierCurveTo(p.r,-p.r*.4,p.r*.6,p.r,0,p.r*.8); x.bezierCurveTo(-p.r*.6,p.r,-p.r,-p.r*.4,0,-p.r); x.fill();
      x.restore();
    });
    requestAnimationFrame(draw);
  }
  if (!matchMedia('(prefers-reduced-motion:reduce)').matches) draw();
})();
</script>
</body>
</html>
